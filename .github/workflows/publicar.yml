# Actualiza los datos de Fitos y publica la web en GitHub Pages.
#
# - Cada viernes y sábado a las 15:30 (hora de Madrid) descarga MAPA,
#   certificadoras, normativa ECO y excepcionales, y guarda los datos en el repositorio.
# - Cada cambio de código en main vuelve a publicar la web.
# - También se puede lanzar a mano desde la pestaña «Actions» → «Run workflow».
name: Actualizar y publicar

on:
  push:
    branches: [main]
  schedule:
    # GitHub solo admite horario UTC: una línea para el horario de invierno
    # y otra para el de verano; la comprobación de abajo deja pasar solo la buena.
    - cron: '30 14 * * 5,6'   # 15:30 en Madrid con horario de invierno (UTC+1)
    - cron: '30 13 * * 5,6'   # 15:30 en Madrid con horario de verano (UTC+2)
  workflow_dispatch:
    inputs:
      actualizar:
        description: 'Descargar datos nuevos antes de publicar'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fitos
  cancel-in-progress: false

jobs:
  actualizar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      fallo: ${{ steps.datos.outputs.fallo }}
    steps:
      - name: Comprobar la hora de Madrid
        id: hora
        run: |
          ejecutar=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            offset=$(TZ=Europe/Madrid date +%z)
            if [ "${{ github.event.schedule }}" = "30 14 * * 5,6" ] && [ "$offset" != "+0100" ]; then ejecutar=false; fi
            if [ "${{ github.event.schedule }}" = "30 13 * * 5,6" ] && [ "$offset" != "+0200" ]; then ejecutar=false; fi
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.actualizar }}" = "false" ]; then ejecutar=false; fi
          echo "ejecutar=$ejecutar" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.hora.outputs.ejecutar == 'true'
      - uses: actions/setup-node@v4
        if: steps.hora.outputs.ejecutar == 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.hora.outputs.ejecutar == 'true'
        run: npm ci --ignore-scripts
      - name: Descargar datos oficiales
        id: datos
        if: steps.hora.outputs.ejecutar == 'true'
        run: |
          if node scripts/actualizar.mjs; then echo "fallo=no" >> "$GITHUB_OUTPUT"; else echo "fallo=si" >> "$GITHUB_OUTPUT"; fi
      - name: Guardar los datos en el repositorio
        if: steps.hora.outputs.ejecutar == 'true'
        run: |
          git config user.name "fitos-actualizador"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then echo "Sin cambios en los datos"; exit 0; fi
          git commit -m "Datos actualizados $(TZ=Europe/Madrid date '+%d/%m/%Y %H:%M')"
          git pull --rebase
          git push

  publicar:
    needs: actualizar
    if: always() && needs.actualizar.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: despliegue
        uses: actions/deploy-pages@v4
      - name: Avisar si algún apartado no se actualizó
        if: needs.actualizar.outputs.fallo == 'si'
        run: |
          echo "::error::Algún apartado no se pudo actualizar; la web conserva su última versión válida. Ver el resumen del paso «Descargar datos oficiales»."
          exit 1
