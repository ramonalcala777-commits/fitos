# Actualiza los datos de Fitos y publica la web en GitHub Pages.
#
# - Cada viernes y sábado a las 15:13 (hora de Madrid; no en hora «redonda» porque GitHub va más saturado y se retrasa) descarga MAPA,
#   certificadoras, normativa ECO y excepcionales, y guarda los datos en el repositorio.
# - Cada cambio de código en main vuelve a publicar la web.
# - También se puede lanzar a mano desde la pestaña «Actions» → «Run workflow».
name: Actualizar y publicar

on:
  push:
    branches: [main]
  schedule:
    # GitHub solo admite horario UTC: una línea para el horario de invierno
    # y otra para el de verano; la comprobación de abajo deja pasar solo la buena.
    - cron: '13 14 * * 5,6'   # 15:13 en Madrid con horario de invierno (UTC+1)
    - cron: '13 13 * * 5,6'   # 15:13 en Madrid con horario de verano (UTC+2)
  workflow_dispatch:
    inputs:
      actualizar:
        description: 'Descargar datos nuevos antes de publicar'
        type: boolean
        default: true
      apartados:
        description: 'Apartados a actualizar (vacío = todos): insumos,normativa,mapa,excepcionales'
        type: string
        default: ''

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: fitos
  cancel-in-progress: false

jobs:
  actualizar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      fallo: ${{ steps.datos.outputs.fallo }}
      ejecutar: ${{ steps.hora.outputs.ejecutar }}
    env:
      TZ: Europe/Madrid   # el MAPA da sus fechas en hora de Madrid
      # Raíz oficial FNMT G2R que usa www.mapa.gob.es y aún no viene de serie (ver certificados/LEEME.md)
      NODE_EXTRA_CA_CERTS: certificados/fnmt-raiz-servidores-seguros-g2r.pem
      # CERES: tiempo para confirmar certificados de proveedores (antes 1 minuto y 3 fallos)
      CERES_PRESUPUESTO_MINUTOS: 45
      CERES_MAX_FALLOS: 150
      CERES_ESPERA_PDF_SEGUNDOS: 150
    steps:
      - name: Comprobar la hora de Madrid
        id: hora
        run: |
          ejecutar=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            offset=$(TZ=Europe/Madrid date +%z)
            if [ "${{ github.event.schedule }}" = "13 14 * * 5,6" ] && [ "$offset" != "+0100" ]; then ejecutar=false; fi
            if [ "${{ github.event.schedule }}" = "13 13 * * 5,6" ] && [ "$offset" != "+0200" ]; then ejecutar=false; fi
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.actualizar }}" = "false" ]; then ejecutar=false; fi
          echo "ejecutar=$ejecutar" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.hora.outputs.ejecutar == 'true'
      - uses: actions/setup-node@v4
        if: steps.hora.outputs.ejecutar == 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.hora.outputs.ejecutar == 'true'
        run: npm ci --ignore-scripts
      - name: Descargar datos oficiales
        id: datos
        if: steps.hora.outputs.ejecutar == 'true'
        run: |
          if node scripts/actualizar.mjs ${{ inputs.apartados }}; then echo "fallo=no" >> "$GITHUB_OUTPUT"; else echo "fallo=si" >> "$GITHUB_OUTPUT"; fi
      - name: Guardar los datos en el repositorio
        if: steps.hora.outputs.ejecutar == 'true'
        run: |
          git config user.name "fitos-actualizador"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then echo "Sin cambios en los datos"; exit 0; fi
          git commit -m "Datos actualizados $(TZ=Europe/Madrid date '+%d/%m/%Y %H:%M')"
          git pull --rebase
          git push
      - name: Avisar por correo si hay novedades
        if: steps.hora.outputs.ejecutar == 'true' && steps.datos.outputs.novedades == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Resumen de la actualización de Fitos del $(date '+%d/%m/%Y')."
            echo
            node -e "process.stdout.write(require('./public/data/novedades.json').markdown)"
            echo
            echo "Web: https://ramonalcala777-commits.github.io/fitos/"
            echo
            echo "@ramonalcala777-commits"
          } > aviso.md
          gh issue create --title "Novedades Fitos $(date '+%d/%m/%Y')" --body-file aviso.md

  publicar:
    needs: actualizar
    # La ejecución programada «de control» (la del otro horario) no descarga nada: entonces no se vuelve a publicar.
    if: always() && needs.actualizar.result != 'cancelled' && (github.event_name != 'schedule' || needs.actualizar.outputs.ejecutar == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url || steps.despliegue2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: despliegue
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # Si GitHub Pages se queda atascado («syncing files»), se espera un minuto y se reintenta una vez.
      - name: Esperar antes de reintentar la publicación
        if: steps.despliegue.outcome == 'failure'
        run: sleep 60
      - id: despliegue2
        if: steps.despliegue.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Avisar si algún apartado no se actualizó
        if: needs.actualizar.outputs.fallo == 'si'
        run: |
          echo "::error::Algún apartado no se pudo actualizar; la web conserva su última versión válida. Ver el resumen del paso «Descargar datos oficiales»."
          exit 1
